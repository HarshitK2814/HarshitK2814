<svg xmlns="http://www.w3.org/2000/svg" width="900" height="246" viewBox="0 0 900 246" role="img" aria-labelledby="title desc">
<title id="title">Harshit's research workbench</title><desc id="desc">From a testable question through point-in-time data and locked tests to reproducible evidence. Open the interactive trend-following study.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#101619"/></linearGradient><linearGradient id="line"><stop stop-color="#56d4c5"/><stop offset="1" stop-color="#91b9ff"/></linearGradient></defs>
<style>text{font-family:Segoe UI,Helvetica,Arial,sans-serif}.small{font-size:11px;letter-spacing:1.8px;fill:#9aadc3}.label{font-size:16px;font-weight:600;fill:#eef4fc}.note{font-size:12px;fill:#abbcd1}.flow{stroke-dasharray:8 12;animation:flow 12s linear infinite}@keyframes flow{to{stroke-dashoffset:-240}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
<rect x=".5" y=".5" width="899" height="245" rx="14" fill="url(#bg)" stroke="#304256"/>
<circle cx="25" cy="25" r="4" fill="#56d4c5"/><text x="40" y="29" class="small">HARSHIT / RESEARCH WORKBENCH</text>
<text x="26" y="67" fill="#f0f6fc" font-size="25" font-weight="600">An idea is only as good as its test.</text>
<text x="26" y="91" class="note">Systematic trading · Prediction markets · Portfolio construction</text>
<path d="M58 141H840" stroke="#304256" stroke-width="2"/><path class="flow" d="M58 141H840" stroke="url(#line)" stroke-width="2"/>
<rect x="26" y="117" width="188" height="63" rx="8" fill="#142235" stroke="#344a63"/><text x="38" y="139" class="small">01</text><text x="66" y="140" class="label">Question</text><text x="38" y="162" class="note">Freeze the hypothesis</text><rect x="246" y="117" width="188" height="63" rx="8" fill="#142235" stroke="#344a63"/><text x="258" y="139" class="small">02</text><text x="286" y="140" class="label">Data</text><text x="258" y="162" class="note">Respect what was known</text><rect x="466" y="117" width="188" height="63" rx="8" fill="#142235" stroke="#344a63"/><text x="478" y="139" class="small">03</text><text x="506" y="140" class="label">Test</text><text x="478" y="162" class="note">Account for costs</text><rect x="686" y="117" width="188" height="63" rx="8" fill="#142235" stroke="#344a63"/><text x="698" y="139" class="small">04</text><text x="726" y="140" class="label">Evidence</text><text x="698" y="162" class="note">Keep the failed results</text>
<text x="26" y="218" fill="#69e0ce" font-size="13" font-weight="600">OPEN THE INTERACTIVE TREND STUDY →</text><text x="661" y="218" class="small">REPRODUCE. QUESTION. REPEAT.</text>
</svg>